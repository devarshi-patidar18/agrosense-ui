<div class="container">
    <h2>AgroSense Users</h2>

    <form (ngSubmit)="addUser()" class="form">
        <input [(ngModel)]="newUser.name" name="name" placeholder="Name" required />
        <input [(ngModel)]="newUser.email" name="email" placeholder="Email" required />
        <button type="submit">Add User</button>
    </form>

    @if (loading) {
    <div>Loading users...</div>
    }

    @if (!loading && users.length > 0) {
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Role</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody>
            @for (item of users; track $index) {
            <tr>
                <td>{{ item.id }}</td>
                <td>{{ item.name }}</td>
                <td>{{ item.email }}</td>
                <td>{{ item.role || 'User' }}</td>
                <td>
                    <button (click)="deleteUser(item.id)">Delete</button>
                </td>
            </tr>
            }
        </tbody>
    </table>
    }

@if (!loading && users.length === 0) {
    <div>No users found.</div>
    }
</div>
